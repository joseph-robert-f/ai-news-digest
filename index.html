<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI News Digest</title>
<style>
  :root {
    --ink: #17181c;
    --muted: #6b7280;
    --faint: #9aa1a9;
    --line: #ececef;
    --bg: #ffffff;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  header.bar {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: 0.7rem 1.25rem; background: var(--bg);
    border-bottom: 1px solid var(--line); z-index: 2;
  }
  .brand { display: flex; flex-direction: column; line-height: 1.1; text-decoration: none; }
  .brand .eyebrow {
    font-size: 0.62rem; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent);
  }
  .brand .name { font-size: 1.02rem; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .latest { color: var(--muted); font-size: 0.88rem; }
  .latest strong { color: var(--ink); font-weight: 600; }
  nav { margin-left: auto; display: flex; align-items: center; gap: 0.4rem; }
  nav a {
    color: var(--muted); text-decoration: none; font-size: 0.86rem; font-weight: 500;
    padding: 0.35rem 0.7rem; border-radius: 7px;
  }
  nav a:hover { color: var(--ink); background: #f4f5f7; }
  nav a.primary { color: var(--accent); }
  .frame-wrap { flex: 1; position: relative; }
  iframe { border: 0; width: 100%; height: 100%; position: absolute; inset: 0; background: var(--bg); }
  .status { padding: 2.5rem; text-align: center; color: var(--muted); font-size: 0.92rem; }
  .status.error { color: #b42318; }
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="./">
    <span class="eyebrow">AI Executive Brief</span>
    <span class="name">AI News Digest</span>
  </a>
  <span class="latest" id="latest"></span>
  <nav>
    <a href="./archive.html">Archive</a>
    <a class="primary" id="open-new" href="#" target="_blank" rel="noopener">Open full &#8599;</a>
  </nav>
</header>
<div class="frame-wrap">
  <iframe id="frame" title="Digest"></iframe>
  <div class="status" id="status">Loading latest digest&hellip;</div>
</div>
<script>
(async function () {
  const statusEl = document.getElementById('status');
  const frame = document.getElementById('frame');
  const latestEl = document.getElementById('latest');
  const openNew = document.getElementById('open-new');
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const formatDate = (iso) => {
    const [y, m, d] = iso.split('-').map(Number);
    return d + ' ' + MONTHS[m - 1] + ' ' + y;
  };
  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const encodePath = (p) => p.split('/').map(encodeURIComponent).join('/');

  try {
    const res = await fetch('./digests.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('Could not load digests.json (HTTP ' + res.status + ')');
    const data = await res.json();
    const list = (data.digests || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    if (!list.length) throw new Error('No digests found yet.');

    const params = new URLSearchParams(location.search);
    const wantPath = params.get('path');
    const wantDate = params.get('date');
    let entry = list[0];
    if (wantPath) entry = list.find((d) => d.path === wantPath) || entry;
    else if (wantDate) entry = list.find((d) => d.date === wantDate) || entry;

    const url = encodePath(entry.path);
    frame.src = url;
    openNew.href = url;
    const isLatest = entry === list[0];
    latestEl.innerHTML = (isLatest ? 'Latest &middot; ' : 'Showing &middot; ') +
      '<strong>' + escapeHtml(formatDate(entry.date)) + '</strong>';
    document.title = 'AI News Digest — ' + formatDate(entry.date);
    frame.addEventListener('load', () => { statusEl.style.display = 'none'; });
  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = (err && err.message) ? err.message : String(err);
  }
})();
</script>
</body>
</html>
