name: Build and deploy site

# Regenerates digests.json from the digest HTML files and publishes the whole
# repo to GitHub Pages. Runs on every push to main, so you can add a digest by
# committing an HTML file directly to main — no PR, no manual manifest edits.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Backstop: redeploy once a day even if a merge/push didn't trigger the build
  # (e.g. a token-based merge). Runs ~08:47 US Eastern (UTC; drifts 1h at DST) —
  # after the 06:30 ET digest routine. Idempotent: just rebuilds current main.
  schedule:
    - cron: "47 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate digests.json
        run: node scripts/build-manifest.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
